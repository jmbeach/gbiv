[package]
name = "gbiv"
version = "0.1.0"
edition = "2021"
description = "A CLI tool that turns a git repository into seven parallel color-named worktrees (ROYGBIV) for managing multiple features simultaneously"
license = "MIT"
repository = "https://github.com/jmbeach/gbiv"
keywords = ["git", "worktree", "developer-tools", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
gbiv-core = { path = "../gbiv-core" }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tiny_http = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ctrlc = { version = "3.5.2", features = ["termination"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
